name: Daily Scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m app.seed
      # Scans and drafts only -- every module here writes to the Approval Inbox
      # (PENDING_APPROVAL), never sends/publishes. See scripts/daily_scan.py.
      - run: python scripts/daily_scan.py
      - name: Commit refreshed health.json
        run: |
          git config user.name "magnet-bot"
          git config user.email "bot@magnet.local"
          git add ../health.json
          git diff --cached --quiet || git commit -m "chore: daily scan health update"
          git push || true
