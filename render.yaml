services:
  - type: web
    name: magnet-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MAGNET_DB
        value: /opt/render/project/src/backend/magnet.db
      - key: MAGNET_AUTO_SEED
        value: "1"
      - key: MAGNET_LIVE_SOURCES
        value: "0"
      # Optional live-LLM keys -- leave unset for zero-key demo mode.
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: GROQ_API_KEY
      #   sync: false
