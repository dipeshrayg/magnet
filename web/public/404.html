<!doctype html>
<!--
  GitHub Pages serves this for any unknown path (i.e. every client-side route
  MAGNET's router owns, like /w/1/leads). It stashes the real path and
  bounces to index.html, which restores it via history.replaceState before
  React mounts. Standard SPA-on-Pages workaround -- no server, no extra deps.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      sessionStorage.setItem("magnet-redirect-path", location.pathname + location.search + location.hash);
      location.replace(location.pathname.split("/").slice(0, 2).join("/") || "/");
    </script>
  </head>
  <body></body>
</html>
